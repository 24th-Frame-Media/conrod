[package]
name = "conrod-app"
description = "Conrod, the Tauri desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "Conrod"
path = "src/main.rs"

[dependencies]
conrod-core = { path = "../conrod-core" }
conrod-engine = { path = "../conrod-engine" }
rfd = "0.17"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

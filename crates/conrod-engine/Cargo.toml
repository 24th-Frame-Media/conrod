[package]
name = "conrod-engine"
description = "Conrod's scan: the cull lane over a folder, with progress for the status area."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
conrod-core = { path = "../conrod-core" }
conrod-io = { path = "../conrod-io" }
conrod-vision = { path = "../conrod-vision" }
conrod-store = { path = "../conrod-store" }
dunce = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

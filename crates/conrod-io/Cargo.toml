[package]
name = "conrod-io"
description = "Conrod's file IO: reading RAW and JPEG frames without exiftool."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
conrod-core = { path = "../conrod-core" }
# For the VLM crop resize (Pillow-exact Lanczos) and its JPEG encoder.
conrod-vision = { path = "../conrod-vision" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Serial number and capture time, including Canon makernotes; checked against
# exiftool on 100 of the owner's CR3/CR2 files (SPIKES.md, spike C).
rawler = "0.8"
serde_json = "1"
# Blocking HTTP for the VLM providers: this crate has no async runtime
# anywhere else and one crop's request is not worth pulling tokio in for.
# ureq is sync, has no dependency on tokio, and its 3.x line exposes the
# http_status_as_error toggle and the connect/global timeouts vlm.py's
# _send() and ollama_request() need.
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
sha2 = "0.10"
# Retry-After as an HTTP-date; already in the dependency tree via ureq.
httpdate = "1"

[workspace]
resolver = "2"
members = ["crates/conrod-core", "crates/conrod-vision", "crates/conrod-io", "crates/conrod-store", "crates/conrod-cli", "crates/conrod-engine", "crates/conrod-app", "spikes/rawprobe", "spikes/detbench"]
# Spikes pull ONNX Runtime and GPU runtimes (hundreds of MB); CI and a plain
# `cargo test` build only the product crates. Run a spike with -p.
default-members = ["crates/conrod-core", "crates/conrod-vision", "crates/conrod-io", "crates/conrod-store", "crates/conrod-cli", "crates/conrod-engine", "crates/conrod-app"]

[workspace.package]
version = "1.0.0-beta.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/kapsikkum/conrod"

[profile.release]
lto = "thin"
codegen-units = 1

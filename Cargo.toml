[workspace]
resolver = "2"
members = ["crates/conrod-core", "crates/conrod-vision", "crates/conrod-io", "crates/conrod-store", "crates/conrod-cli", "crates/conrod-engine", "crates/conrod-app", "crates/conrod-decider"]
# The old spikes/ crates (rawprobe, detbench) are out of the workspace: they are
# stale, and they pull ONNX Runtime and GPU runtimes for no product benefit.
# Their history stays in git; resurrect one with `cargo new` if it is ever needed.
default-members = ["crates/conrod-core", "crates/conrod-vision", "crates/conrod-io", "crates/conrod-store", "crates/conrod-cli", "crates/conrod-engine", "crates/conrod-app", "crates/conrod-decider"]


[workspace.package]
version = "1.0.0-beta.8"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/24th-Frame-Media/conrod"

[profile.dev]
opt-level = 2
# Optimised incremental builds intermittently fail to link on MSVC (unresolved
# `*.llvm.*` symbols in Conrod.exe); full rebuilds of the changed crates do not.
incremental = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

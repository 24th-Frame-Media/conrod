name: Release (Rust)

# Tag-triggered: push v1.0.0 and this builds the Windows installer and a portable
# zip and attaches them, with checksums, to a GitHub Release. A tag with a suffix
# (v1.0.0-beta.1) is published as a pre-release, which is not "latest".
on:
  push:
    tags:
      - "v*"
  # workflow_dispatch has no branch filter of its own: the "Run workflow" button
  # is offered from the default branch, but the API can dispatch any branch that
  # has this file. The jobs below refuse any ref that is not main or a v* tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

permissions:
  contents: read

jobs:
  # What a release must pass before anything is built for it. Mirrors
  # .github/workflows/check.yml, but in release mode because that is what ships.
  # The frontend is built first: conrod-app's build script needs frontend/dist.
  test:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test the frontend
        working-directory: frontend
        run: npm test
      # Cargo 1.90+ nests a build script's OUT_DIR one level deeper
      # (build/<crate>/<hash>/out). ort-sys still walks up three ancestors when
      # it copies DirectML.dll, so it writes to target/<profile>/build and then
      # expects build/examples and build/deps beside it. A cold cargo build
      # never creates those, and the copy panics with "The system cannot find
      # the path specified". Create them for both profiles used here.
      - name: Prepare the build directories for ort-sys
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force target/debug/build/examples | Out-Null
          New-Item -ItemType Directory -Force target/debug/build/deps | Out-Null
          New-Item -ItemType Directory -Force target/release/build/examples | Out-Null
          New-Item -ItemType Directory -Force target/release/build/deps | Out-Null
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # conrod-app has no test targets of its own (the shipped exe is exercised
      # by --selftest below), so it is left out here; clippy still compiles it.
      - run: cargo test --release --workspace --exclude conrod-app

  # Builds and publishes in one job: contents: write is needed for the two
  # softprops/action-gh-release steps at the end, so it is granted here.
  build-windows:
    needs: [test]
    # An if: on a job replaces the implicit success() check, so ask for it.
    if: needs.test.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      # Full history and tags: scripts/release-notes.mjs walks commits between tags to write the
      # release notes below, which a shallow, single-tag checkout would not have.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # One version across Cargo.toml, tauri.conf.json, package.json and the tag,
      # so an installer never says one thing and its filename another.
      - name: Check the version everywhere
        env:
          VERSION: v${{ steps.version.outputs.value }}
        run: node scripts/check-version.mjs "$env:VERSION"

      # The release body and the in-app "What's new" come from the same generator: user-facing
      # commits since the previous tag, grouped New/Improved/Fixed and worded by
      # scripts/release-notes.overrides.json. `--version` measures from the previous tag to this
      # one when the tag already exists (the normal, tag-triggered run), or to HEAD otherwise
      # (a workflow_dispatch build ahead of tagging).
      - name: Generate the release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          node scripts/release-notes.mjs --version "$VERSION" --body dist/notes.md
          {
            echo "## Conrod $VERSION"
            echo
            cat dist/notes.md
            echo
            echo "---"
            echo
            echo "**Installer** (\`-setup.exe\`, per-user, no admin) or **portable** (unzip, run \`Conrod.exe\`)."
            echo "ExifTool is bundled; the AI models (~97 MB) download and verify themselves on first"
            echo "run. An existing \`~/.conrod\` library, settings and trained models are used as they are."
            echo
            echo "Optional: **Ollama** plus \`ollama pull qwen3-vl:8b-instruct-q4_K_M\` (~6 GB) names make, model,"
            echo "colour and team. Without it Conrod still culls, reads plates, numbers and livery text."
            echo
            echo "The installer is not code-signed, so Windows SmartScreen will ask you to confirm."
          } > dist/release-body.md
          cat dist/release-body.md

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ExifTool, pinned by SHA-256 in scripts/assets.json (models are not bundled;
      # the app downloads and verifies them on first run). A download whose hash
      # differs fails the release rather than shipping it.
      - name: Fetch the pinned release assets
        run: powershell -NoProfile -File scripts/fetch-release-assets.ps1

      # Only installs: `tauri build` runs the frontend build itself
      # (beforeBuildCommand in tauri.conf.json), and needs node_modules for the CLI.
      - name: Install the frontend dependencies
        working-directory: frontend
        run: npm ci

      # Cargo 1.90+ nests a build script's OUT_DIR one level deeper
      # (build/<crate>/<hash>/out). ort-sys still walks up three ancestors when
      # it copies DirectML.dll, so it writes to target/release/build and then
      # expects build/examples and build/deps beside it. A cold cargo build
      # never creates those, and the copy panics with "The system cannot find
      # the path specified". Create them so the ONNX Runtime copy succeeds.
      - name: Prepare the build directories for ort-sys
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force target/release/build/examples | Out-Null
          New-Item -ItemType Directory -Force target/release/build/deps | Out-Null

      # The signing key is what makes an update installable: Tauri checks the
      # installer's minisign signature against the public key compiled into the app.
      # A pre-release build (version with a suffix) is built with the beta update
      # endpoint (tauri.beta.conf.json), so it follows beta.json; a stable build
      # keeps the endpoint in tauri.conf.json (latest.json).
      - name: Build the app and the installer
        working-directory: crates/conrod-app
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $extra = @()
          if ($env:VERSION -like '*-*') { $extra = @('--config', 'tauri.beta.conf.json') }
          node ../../frontend/node_modules/@tauri-apps/cli/tauri.js build --ci @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble the portable folder
        shell: powershell
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $v = "$env:VERSION"
          New-Item -ItemType Directory -Force dist/Conrod | Out-Null
          Copy-Item target/release/Conrod.exe dist/Conrod/
          Copy-Item crates/conrod-app/resources dist/Conrod/resources -Recurse
          Copy-Item LICENSE dist/Conrod/
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1) "dist/Conrod-$v-win64-setup.exe"
          Compress-Archive -Path dist/Conrod -DestinationPath "dist/Conrod-$v-win64.zip"

      # Importing proves nothing about a bundle. This runs the shipped exe from the
      # assembled folder: --selftest first downloads any missing models (the
      # installer no longer bundles them), then every model is loaded, a frame
      # goes through the detector, sharpness and OCR, ExifTool, a database. It
      # fails the release if any of them break.
      - name: Self-test the shipped build
        shell: powershell
        run: |
          $p = Start-Process dist/Conrod/Conrod.exe -ArgumentList '--selftest', "$PWD/selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          exit $p.ExitCode

      # The in-app updater refuses to install an asset whose hash does not match
      # this file, so it ships with every release. sha256sum format, as the
      # Python releases use.
      - name: Checksums
        shell: bash
        working-directory: dist
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          sha256sum "Conrod-$VERSION-win64.zip" "Conrod-$VERSION-win64-setup.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The manifest the app's updater reads: version, installer URL and the
      # installer's signature. The installer is renamed for humans above, which is
      # fine: the signature covers its bytes, not its name.
      - name: Build the updater manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          v="$VERSION"
          node scripts/latest-json.mjs "$v" "$(ls target/release/bundle/nsis/*-setup.exe.sig | head -1)" \
            "https://github.com/${{ github.repository }}/releases/download/v$v/Conrod-$v-win64-setup.exe" \
            dist/latest.json "$(cat dist/notes.md)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Conrod-windows
          path: |
            dist/Conrod-*-win64.zip
            dist/Conrod-*-win64-setup.exe
            dist/SHA256SUMS.txt
            dist/latest.json

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          files: |
            dist/Conrod-*-win64.zip
            dist/Conrod-*-win64-setup.exe
            dist/SHA256SUMS.txt
            dist/latest.json
          generate_release_notes: true
          body_path: dist/release-body.md

      # Two fixed manifests on one always-current `updater` release (a pre-release
      # is never GitHub's /releases/latest, so the manifests get their own):
      #   /releases/download/updater/latest.json  stable builds follow this
      #   /releases/download/updater/beta.json    pre-release builds follow this
      # beta.json takes every release, so a beta user moves to the stable build
      # when it ships. latest.json takes only stable releases, so a pre-release
      # never reaches a stable install. One exception, for installs that predate
      # beta.json (their endpoint is latest.json): while latest.json is missing or
      # still names a pre-release, no stable release exists yet and a pre-release
      # refreshes it too. Once a stable version is in it, pre-releases leave it alone.
      # Anything unexpected (HTTP status, unreadable manifest) fails the release.
      - name: Choose the update manifests
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist/updater
          cp dist/latest.json dist/updater/beta.json
          stable=false
          if [[ "$VERSION" != *-* ]]; then
            stable=true
          else
            code=$(curl -sSL -o dist/current-latest.json -w '%{http_code}' \
              "https://github.com/${{ github.repository }}/releases/download/updater/latest.json")
            if [ "$code" = "404" ]; then
              stable=true
            elif [ "$code" = "200" ]; then
              current=$(node -p "JSON.parse(require('fs').readFileSync('dist/current-latest.json','utf8')).version")
              echo "latest.json currently names $current"
              if [[ "$current" == *-* ]]; then stable=true; fi
            else
              echo "unexpected HTTP $code reading the current latest.json" >&2
              exit 1
            fi
          fi
          if [ "$stable" = "true" ]; then
            cp dist/latest.json dist/updater/latest.json
            echo "publishing beta.json and latest.json"
          else
            echo "publishing beta.json only (latest.json holds a stable release)"
          fi
          ls dist/updater

      - name: Publish the updater manifests
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: updater
          name: Update manifest
          body: |
            Machine-readable update manifests for Conrod's in-app updater.
            latest.json: stable releases. beta.json: every release.
            Overwritten on every release; do not edit by hand.
          make_latest: false
          prerelease: false
          overwrite_files: true
          files: dist/updater/*

name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Its parity tests read fixtures generated from the Python app (branch
  # legacy-python), so a divergence from that behaviour fails here.
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rust/frontend/package-lock.json
      - run: npm ci
        working-directory: rust/frontend
      - run: npm run build
        working-directory: rust/frontend
      - run: npm test
        working-directory: rust/frontend
      - run: node scripts/check-version.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
